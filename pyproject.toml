[project]
name = "fplbot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "feedparser>=6.0",
    "praw>=7.7",
    # PuLP 4.0 removes direct LpVariable(name, ...) construction, which
    # optimize.py relies on, and 3.x already warns about it on every
    # variable. Pinned below 4 until that call site is migrated.
    "pulp>=2.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fplbot = "fplbot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# PuLP emits one 4.0 migration warning per variable, thousands per run,
# which buries any genuine warning the suite raises. The dependency is
# pinned below 4 so the underlying call site still works.
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
