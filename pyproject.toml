[project]
name = "fplbot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "feedparser>=6.0",
    "praw>=7.7",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fplbot = "fplbot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# PuLP emits thousands of deprecation warnings per run, which buries any
# genuine warning the suite raises.
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
